version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: StrongPostgresPassword2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - attendance_net

  redis:
    image: redis:7-alpine
    container_name: attendance_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - attendance_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=attendance_db;Username=postgres;Password=StrongPostgresPassword2026!
      - Redis__ConnectionString=redis:6379
      - JwtSettings__Issuer=AttendanceApi
      - JwtSettings__Audience=AttendanceApiClient
      - JwtSettings__SecretKey=ThisIsASecretKeyForJwtAuthenticationAttendanceSystem2026!#
      - JwtSettings__AccessTokenExpirationMinutes=60
      - JwtSettings__RefreshTokenExpirationDays=7
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - attendance_net

volumes:
  postgres_data:
    driver: local

networks:
  attendance_net:
    driver: bridge